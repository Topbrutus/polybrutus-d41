name: Verify Polybrutus D38 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d38:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Verify exact metric, parent conservation and ideal graph
        run: python src/verify_d38.py
      - name: Verify independent 903-pair Fraction metric
        run: python tests/independent_d38.py
      - name: Check deterministic certificate bytes
        run: git diff --exit-code -- results/certificate_d38.json
      - name: Frozen parent D37 certificate SHA-256
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d37/results/certificate_d37.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='f649594103c43927126174dc5d807777bb976bf4feae2e9a1c0ee73aa67f3b2b'"

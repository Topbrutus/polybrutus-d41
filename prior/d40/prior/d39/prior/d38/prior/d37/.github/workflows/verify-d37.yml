name: Verify Polybrutus D37 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d37:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary D37 exact metric and ideal graph
        run: python src/verify_d37.py
      - name: Independent Fraction-based exact 861-pair verifier
        run: python tests/independent_d37.py
      - name: Deterministic certificate unchanged
        run: git diff --exit-code -- results/certificate_d37.json
      - name: Frozen D36 original certificate SHA-256
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d36/results/certificate_d36.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='b189f74f7b38b378fa8f34011660817019c02601e5889378103fd9424207b331'"

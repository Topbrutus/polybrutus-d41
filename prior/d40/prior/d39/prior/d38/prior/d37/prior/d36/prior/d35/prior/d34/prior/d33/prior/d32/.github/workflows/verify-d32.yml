name: Verify Polybrutus D32 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary D32 Euclidean metric and graph proof
        run: python src/verify_d32.py
      - name: Independently verify all 666 Fraction-based labels
        run: python tests/independent_d32.py
      - name: Deterministic JSON certificate unchanged
        run: git diff --exit-code -- results/certificate_d32.json
      - name: Frozen D31 parent certificate SHA-256
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d31/results/certificate_d31.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='7c373c50d61ca2964eb832fc6fb8178590715e603f5fdada122575f624f60e8c'"

name: Verify Polybrutus D23 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d23:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary exact mathematical verification
        run: python src/verify_d23.py
      - name: Independent rational-distance verification
        run: python tests/independent_d23.py
      - name: Deterministic certificate unchanged
        run: git diff --exit-code -- results/certificate_d23.json

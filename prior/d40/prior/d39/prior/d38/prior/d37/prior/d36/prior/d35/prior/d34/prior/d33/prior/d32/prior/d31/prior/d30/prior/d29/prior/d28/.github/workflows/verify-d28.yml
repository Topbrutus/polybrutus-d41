name: Verify Polybrutus D28 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d28:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary exact metric verification
        run: python src/verify_d28.py
      - name: Independent rational-distance verification
        run: python tests/independent_d28.py
      - name: Deterministic certificate unchanged
        run: git diff --exit-code -- results/certificate_d28.json
      - name: Frozen predecessor D27 SHA-256
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d27/results/certificate_d27.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='e464dab0dc5d6586a94a714f1fee06b93710b3ba2763d710501970e6a3e399c4'"

name: Verify Polybrutus D34 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d34:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary exact 741-pair metric and ideal graph
        run: python src/verify_d34.py
      - name: Independently check 741 Fraction-based labelled distances
        run: python tests/independent_d34.py
      - name: Check deterministic certificate committed
        run: git diff --exit-code -- results/certificate_d34.json
      - name: Frozen D33 original certificate SHA-256
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d33/results/certificate_d33.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='86516b8a6393bf9fdf4e698d6e439d4db783a71956730ac35bbc89e2c8e7b734'"

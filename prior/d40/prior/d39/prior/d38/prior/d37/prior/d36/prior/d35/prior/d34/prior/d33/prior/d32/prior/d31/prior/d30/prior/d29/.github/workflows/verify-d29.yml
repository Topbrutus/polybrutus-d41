name: Verify Polybrutus D29 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d29:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Reproduce exact 34-point metric and ideal graph
        run: python src/verify_d29.py
      - name: Independent Fraction-based distance verification
        run: python tests/independent_d29.py
      - name: Reject nondeterministic certificate output
        run: git diff --exit-code -- results/certificate_d29.json
      - name: Frozen D28 parent certificate SHA-256
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d28/results/certificate_d28.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='d21c21645bc96aa480c840fa24e12e755f6a21d8df8a1d51dac989c7caed1788'"

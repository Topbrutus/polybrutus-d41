name: Verify Polybrutus D26 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d26:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary exact metric and graph verification
        run: python src/verify_d26.py
      - name: Independent Fraction-based verification
        run: python tests/independent_d26.py
      - name: Certificate reproducible with no diff
        run: git diff --exit-code -- results/certificate_d26.json
      - name: Check frozen D25 parent certificate checksum
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d25/results/certificate_d25.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='1cad349945e85a0700906762b21c3644ee9188308098b340e99acc525cac4ffd'"

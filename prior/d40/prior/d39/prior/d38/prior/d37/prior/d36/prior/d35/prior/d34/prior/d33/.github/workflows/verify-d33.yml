name: Verify Polybrutus D33 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d33:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary exact 703-pair metric and weighted graph
        run: python src/verify_d33.py
      - name: Independent Fraction-based metric verifier
        run: python tests/independent_d33.py
      - name: Certificate byte-level deterministic check
        run: git diff --exit-code -- results/certificate_d33.json
      - name: Frozen D32 parent checksum
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d32/results/certificate_d32.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='66b7605ab168d99ee33014ed1d61b5fbb3915c32041bdf44dd529c0bb56bb016'"

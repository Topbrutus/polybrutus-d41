name: Verify Polybrutus D39 exact certificate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d39:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Verify exact 946-pair metric and ideal graph
        run: python src/verify_d39.py
      - name: Independently verify Fraction-based 946 labelled distances
        run: python tests/independent_d39.py
      - name: Certificate determinism
        run: git diff --exit-code -- results/certificate_d39.json
      - name: Frozen predecessor D38 certificate SHA-256
        shell: bash
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('prior/d38/results/certificate_d38.json');assert hashlib.sha256(p.read_bytes()).hexdigest()=='3be0e4aaa1487e82f35a97a3521abe70b05992888c550c8fdd95b5d50f306dbc'"
